name: API checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: api-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jobportal_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobportal_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Full suite and contract snapshots (H2)
        run: mvn -B -f backend/pom.xml -Duser.timezone=Asia/Kolkata verify
      - name: Save H2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-test-reports
          path: backend/target/surefire-reports/
      - name: Create isolated PostgreSQL databases
        env:
          PGPASSWORD: local-test-only
        run: psql -h localhost -U jobportal_test -d postgres -v ON_ERROR_STOP=1 -f database/test/create-databases.sql
      - name: PostgreSQL regression suites
        env:
          TEST_DB_PORT: '5432'
        run: bash scripts/test-postgres.sh
      - name: Save PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: backend/target/surefire-reports/
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: jobportal-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check walkthrough startup and retry behavior
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build and start demo stack
        run: docker compose up --build -d
      - name: Execute candidate, company, and admin walkthrough
        run: |
          api_address="$(docker compose port backend 8080)"
          python3 scripts/api-walkthrough.py --base-url "http://$api_address" --wait-seconds 180
      - name: Collect stack logs
        if: always()
        run: docker compose logs --no-color > walkthrough-compose.log
      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-compose-logs
          path: walkthrough-compose.log
      - name: Remove disposable stack
        if: always()
        run: docker compose down -v
