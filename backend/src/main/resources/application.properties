# ===============================================
# Job Portal Backend - Application Configuration  
# ===============================================

# Application Information
spring.application.name=job-portal-backend
server.port=8080

# Email configuration
app.email.from=noreply@jobportal.com

# SMTP Configuration (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@jobportal.com}
spring.mail.password=${MAIL_PASSWORD:}

# ===============================================
# Database Configuration - PostgreSQL
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobportal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobportal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobportal123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# ===============================================
# JPA/Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================
# Security Configuration
# ===============================================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================================
# Swagger/OpenAPI Configuration
# ===============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tryItOutEnabled=true

# ===============================================
# File Upload Configuration
# ===============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.location=/tmp

# ===============================================
# Server Configuration
# ===============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=ON_PARAM
server.error.include-exception=false

# ===============================================
# Jackson Configuration
# ===============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===============================================
# Management/Actuator Endpoints (Optional)
# ===============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ===============================================
# Logging Configuration
# ===============================================
logging.level.com.jobportal=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================================
# Performance and Caching
# ===============================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===============================================
# JWT Configuration
# ===============================================
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationJobPortalAPI2024LongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================================
# GraphQL Configuration
# ===============================================
graphql.servlet.mapping=/graphql/query
graphql.servlet.enabled=true
graphql.servlet.corsEnabled=true
graphql.playground.enabled=true
graphql.playground.mapping=/graphql
graphql.playground.endpoint=/graphql/query
graphql.playground.pageTitle=Job Portal GraphQL

# ===============================================
# Email - disable in Docker (no SMTP available)
# ===============================================
app.email.enabled=${APP_EMAIL_ENABLED:false}

# Rate limit
app.ratelimit.requests-per-minute=60

# Display the same REST group exported to docs/openapi.yaml
springdoc.swagger-ui.url=/v3/api-docs/v1
springdoc.override-with-generic-response=false

# Flyway owns schema creation; Hibernate only checks entity/schema compatibility.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Synthetic data is opt-in outside Compose. Valid modes: off, demo, bulk.
app.seed.mode=off
app.seed.random-seed=42
app.seed.base-time=2027-01-01T09:00:00
