version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobportal-db
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobportal -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobportal-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobportal
      SPRING_DATASOURCE_USERNAME: jobportal
      SPRING_DATASOURCE_PASSWORD: jobportal123
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: mySecretKeyForJWTTokenGenerationJobPortalAPI2024LongEnough
      JWT_EXPIRATION: 86400000
      APP_EMAIL_ENABLED: "false"
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobportal-net
    restart: on-failure

volumes:
  postgres_data:

networks:
  jobportal-net:
    driver: bridge
