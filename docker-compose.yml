services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobportal -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobportal
      SPRING_DATASOURCE_USERNAME: jobportal
      SPRING_DATASOURCE_PASSWORD: jobportal123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: mySecretKeyForJWTTokenGenerationJobPortalAPI2024LongEnough
      JWT_EXPIRATION: 86400000
      APP_EMAIL_ENABLED: "false"
      APP_SEED_MODE: demo
      APP_RESUME_UPLOAD_DIR: /app/uploads/resumes
      SERVER_PORT: 8080
    volumes:
      - resume_data:/app/uploads/resumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobportal-net
    restart: on-failure

volumes:
  postgres_data:
  resume_data:

networks:
  jobportal-net:
    driver: bridge
