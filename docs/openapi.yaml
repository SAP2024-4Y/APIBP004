        Rate limits: Application HTTP requests (excluding CORS preflight) share a fixed 60-second window per directly connected client IP (default 60 requests; configurable). HTTP 429 includes Retry-After. Forwarded-IP headers are not trusted; clients behind one proxy share its quota.
      operationId: getAllJobs
      parameters:
      - description: Exact job lifecycle status.
        example: OPEN
        in: query
        name: status
        required: false
        schema:
          enum:
          - OPEN
          - CLOSED
          - DRAFT
          type: string
      - description: Exact category filter.
        example: Technology
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: "Inclusive lower requirement: job.minSalary >= min_price, whole\
          \ USD per year. Unknown minSalary does not match."
        example: 90000
        in: query
        name: min_price
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: "Inclusive upper requirement: job.maxSalary <= max_price, whole\
          \ USD per year. Unknown maxSalary does not match."
        example: 90000
        in: query
        name: max_price
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: "Sort field with same-direction ID tie-breaker and nulls last.\
          \ Default created_at. Aliases createdAt, minSalary/min_salary, maxSalary/max_salary\
          \ are accepted; unknown fields return 400."
        example: created_at
        in: query
        name: sort
        required: false
        schema:
          default: created_at
          enum:
          - id
          - title
