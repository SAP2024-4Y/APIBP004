servers:
- url: /
tags:
- description: Company profiles are public. Profile creation binds to a COMPANY user;
    writes require the owner or ADMIN. Only ADMIN may set approval.
  name: Company
- description: "Users may read and update their own account without changing role.\
    \ Listing, creating, deleting accounts, and changing roles require ADMIN."
  name: User
- description: Candidates manage their own resumes. Companies may read resumes of
    applicants to their jobs. Global listing requires ADMIN.
  name: Resume
- description: Authentication endpoints for login and registration
  name: Authentication
- description: Interview slot scheduling API - time-window filtering and conflict
    prevention
  name: Calendar
- description: Geospatial job search - radius and bounding-box
  name: Map
- description: Candidates manage their own profile. Companies may read candidates
    who applied to their jobs. ADMIN may manage all profiles and list candidates.
  name: Candidate
- description: Applications are private. Candidates submit and withdraw their own
    applications; the owning company or ADMIN reviews them. Global listing requires
    ADMIN.
  name: Application
- description: "Job management API - Browse, create, update, and delete job postings"
  name: Jobs
