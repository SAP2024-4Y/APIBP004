components:
  headers:
    RateLimit-Limit:
      description: Configured requests per 60-second window per client IP; default
        60
      example: 60
      schema:
        format: int32
        type: integer
    RateLimit-Remaining:
      description: Remaining requests in the current window
      example: 59
      schema:
        format: int32
        type: integer
    RateLimit-Reset:
      description: UTC Unix epoch seconds when this window expires
      example: 1795600860
      schema:
        format: int64
        type: integer
    Retry-After:
      description: Seconds until the current window expires
      example: 60
      schema:
        format: int32
        type: integer
  schemas:
    Application:
      properties:
        appliedAt:
          description: Server-assigned local date-time of application submission.
          nullable: true
          type: string
        candidateId:
          description: "Candidate-profile ID, not user ID."
          format: int32
          nullable: false
          type: integer
        id:
          description: Server-generated resource identifier.
          format: int32
          nullable: false
          type: integer
        jobId:
          description: Associated job-posting ID.
          format: int32
          nullable: false
          type: integer
        status:
          description: Status.
          enum:
          - SUBMITTED
          - REVIEWED
          - SHORTLISTED
          - REJECTED
          - HIRED
          nullable: false
          type: string
      required:
      - appliedAt
      - candidateId
      - id
      - jobId
      - status
      type: object
    AuthResponse:
      properties:
        email:
          description: Email.
          nullable: false
          type: string
        message:
          description: Message.
          nullable: false
          type: string
        role:
          description: Role.
          enum:
          - CANDIDATE
          - COMPANY
          - ADMIN
          nullable: false
          type: string
        token:
          description: "JWT used in the Authorization: Bearer header."
          nullable: false
          type: string
        userId:
          description: Associated user-account ID; differs from the profile ID.
          format: int32
          nullable: false
          type: integer
      required:
      - email
      - message
      - role
      - token
      - userId
      type: object
    Candidate:
      properties:
        experience:
          description: Experience.
          nullable: true
          type: string
        fullName:
          description: Full name.
          nullable: false
          type: string
        id:
          description: Server-generated resource identifier.
          format: int32
          nullable: false
          type: integer
        location:
          description: Location.
          nullable: true
          type: string
        phone:
          description: Phone.
          nullable: true
          type: string
        userId:
          description: Associated user-account ID; differs from the profile ID.
          format: int32
          nullable: false
          type: integer
      required:
      - experience
      - fullName
      - id
      - location
      - phone
      - userId
      type: object
    Company:
      properties:
        address:
          description: Address.
          nullable: true
          type: string
        approved:
          description: Approved.
          nullable: false
          type: boolean
        companyName:
          description: Company name.
          nullable: false
          type: string
        id:
          description: Server-generated resource identifier.
          format: int32
          nullable: false
          type: integer
        industry:
          description: Industry.
          nullable: true
          type: string
        userId:
          description: Associated user-account ID; differs from the profile ID.
          format: int32
          nullable: false
          type: integer
      required:
      - address
      - approved
      - companyName
      - id
      - industry
      - userId
      type: object
    CreateApplicationDto:
      properties:
        candidateId:
          description: Derived from CANDIDATE JWT if omitted. Only CANDIDATE may submit
            applications.
          format: int32
          minimum: 1
          type: integer
        jobId:
          format: int32
          minimum: 1
          type: integer
      required:
      - jobId
      type: object
    CreateCandidateDto:
      properties:
        experience:
          maxLength: 255
          minLength: 0
          type: string
        fullName:
          maxLength: 255
          minLength: 2
          type: string
        location:
          maxLength: 255
          minLength: 0
          type: string
        phone:
          maxLength: 255
          minLength: 0
          pattern: "^$|(?:[^0-9]*[0-9]){10,}[^0-9]*$"
          type: string
        userId:
          description: "Optional for the matching role: derived from JWT. ADMIN must\
            \ supply a user ID. Ownership cannot be changed."
          format: int32
          minimum: 1
          type: integer
      required:
      - fullName
      type: object
    CreateCompanyDto:
      properties:
        address:
          maxLength: 255
          minLength: 0
          type: string
        approved:
          description: Only ADMIN may set approval. COMPANY creation always starts
            unapproved.
          type: boolean
        companyName:
          maxLength: 255
          minLength: 2
          type: string
        industry:
          maxLength: 255
          minLength: 0
          type: string
        userId:
          description: "Optional for the matching role: derived from JWT. ADMIN must\
            \ supply a user ID. Ownership cannot be changed."
          format: int32
          minimum: 1
          type: integer
      required:
      - companyName
      type: object
    CreateJobDto:
      properties:
        category:
          maxLength: 255
          minLength: 0
          type: string
        companyId:
          format: int32
          minimum: 1
          type: integer
        description:
          maxLength: 2147483647
          minLength: 20
          type: string
        employmentType:
          pattern: FULL_TIME|PART_TIME|CONTRACT|INTERNSHIP|FREELANCE|Full-time|Part-time|Contract|Internship|Freelance
          type: string
        endsAt:
          description: Optional job-level local date-time strictly after startsAt.
          example: 2027-02-01T10:00:00
          type: string
        latitude:
          exclusiveMaximum: false
          exclusiveMinimum: false
          format: double
          maximum: 90
          minimum: -90
          type: number
        location:
          maxLength: 255
          minLength: 0
          type: string
        longitude:
          exclusiveMaximum: false
          exclusiveMinimum: false
          format: double
          maximum: 180
          minimum: -180
          type: number
        maxSalary:
          description: "Whole USD per year, inclusive upper salary bound; must be\
            \ at least minSalary."
          format: int32
          minimum: 0
          type: integer
        minSalary:
          description: "Whole USD per year, inclusive lower salary bound; null means\
            \ unknown."
          format: int32
          minimum: 0
          type: integer
        salaryRange:
          deprecated: true
          description: Legacy display text. Numeric bounds are authoritative USD per
            year and regenerate this text when present.
          maxLength: 255
          minLength: 0
          type: string
        skillsRequired:
          type: string
        startsAt:
          description: Optional job-level local date-time. Supply both time bounds
            on creation; does not create an interview slot.
          example: 2027-02-01T09:00:00
          type: string
        status:
          description: Defaults OPEN on creation; omitted/null preserves current value
            on update.
          enum:
          - OPEN
          - CLOSED
          - DRAFT
          pattern: OPEN|CLOSED|DRAFT
          type: string
        title:
          maxLength: 255
          minLength: 3
          type: string
      required:
      - companyId
      - description
      - title
      type: object
    CreateSlotDto:
      properties:
        candidateId:
          description: "Candidate profile ID, not user ID. Derived for CANDIDATE callers."
          format: int32
          minimum: 1
          type: integer
        endsAt:
          description: Must be later than startsAt.
          example: 2027-01-10T10:30:00
          type: string
        jobId:
          format: int32
          minimum: 1
          type: integer
        startsAt:
          description: ISO local date-time; trailing Z is accepted. Offset conversion
            is not implemented.
          example: 2027-01-10T10:00:00
          type: string
      required:
      - endsAt
      - jobId
      - startsAt
      type: object
    CreateUserDto:
      properties:
        email:
          maxLength: 255
          minLength: 0
          type: string
        password:
          format: password
          maxLength: 72
          minLength: 6
          type: string
          writeOnly: true
        role:
          enum:
          - CANDIDATE
          - COMPANY
          - ADMIN
          pattern: CANDIDATE|COMPANY|ADMIN
          type: string
      required:
      - email
      - password
      - role
      type: object
    ErrorResponse:
      description: "Shared REST error response, including errors raised before controller\
        \ execution."
      properties:
        code:
          description: Stable application error code
          example: VALIDATION_ERROR
          type: string
        details:
          description: Field validation details; empty when not applicable
          items:
            description: Field validation details; empty when not applicable
