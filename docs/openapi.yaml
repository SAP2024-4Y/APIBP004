  /api/v1/jobs/map:
    get:
      deprecated: false
      description: |-
        Use case: Find jobs near a location or inside a map area.

        Consumers: map search screens.

        Roles and ownership: Anonymous, CANDIDATE, COMPANY, and ADMIN.

        Workflow and side effects: Supply all three radius parameters OR all four box parameters; mixed or incomplete modes return 400. No filters returns all geocoded jobs. Coordinates are decimal degrees, radius is positive finite kilometres of straight-line spherical distance (Earth radius 6371 km), not travel distance. Radius and box boundaries are inclusive; radius uses 0.1 mm floating-point tolerance. Dateline/pole radius searches are supported. Box minimum latitude must not exceed maximum; min_lon > max_lon means a box crossing the dateline. Longitude +/-180 identifies the same boundary. GeoJSON coordinates are [longitude, latitude]. Null-coordinate jobs are excluded; OPEN, CLOSED, DRAFT and remote jobs with coordinates are included. Results are unpaginated, unbounded and sorted by job ID; no matches returns an empty FeatureCollection.

        Rate limits: Application HTTP requests (excluding CORS preflight) share a fixed 60-second window per directly connected client IP (default 60 requests; configurable). HTTP 429 includes Retry-After. Forwarded-IP headers are not trusted; clients behind one proxy share its quota.
      operationId: searchByLocation
      parameters:
      - description: "Latitude in decimal degrees, between -90 and 90."
        example: 37.7749
        in: query
        name: latitude
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
      - description: "Longitude in decimal degrees, between -180 and 180."
        example: -122.4194
        in: query
        name: longitude
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
      - description: Positive finite kilometres of straight-line spherical distance.
          Inclusive boundary; 5 finds jobs within 5 km. Poles/dateline are supported.
        example: 5
        in: query
        name: radius_km
        required: false
        schema:
          exclusiveMinimum: true
          format: double
          minimum: 0
          type: number
      - description: "Latitude in decimal degrees, between -90 and 90."
        example: 37.7749
        in: query
        name: min_lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
      - description: "Longitude in decimal degrees, between -180 and 180."
        example: -122.4194
        in: query
        name: min_lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
      - description: "Latitude in decimal degrees, between -90 and 90."
        example: 37.7749
        in: query
        name: max_lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
      - description: "Longitude in decimal degrees, between -180 and 180."
        example: -122.4194
        in: query
        name: max_lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
