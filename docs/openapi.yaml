          type: array
        error:
          description: HTTP reason phrase
          example: Bad Request
          type: string
        message:
          description: Human-readable explanation
          example: Job title must be at least 3 characters long
          type: string
        path:
          description: Request path without query parameters
          example: /api/v1/jobs
          type: string
        status:
          description: HTTP response status
          example: 400
          format: int32
          type: integer
        timestamp:
          description: UTC time of the failure
          example: 2027-01-10T10:00:00Z
          format: date-time
          type: string
      required:
      - code
      - details
      - error
      - message
      - path
      - status
      - timestamp
      type: object
