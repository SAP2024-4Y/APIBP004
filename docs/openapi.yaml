info:
  description: "A comprehensive job portal REST API for managing job applications,\
    \ candidates, companies, and job postings"
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  title: Job Portal API
  version: "1.0"
openapi: 3.0.1
paths:
  /api/v1/applications:
    get:
      deprecated: false
      description: |-
        Use case: List all applications.

        Consumers: candidate tracking and recruiter review screens.

        Roles and ownership: ADMIN only.

        Workflow and side effects: Use profile/job/application IDs from earlier workflow steps. Lists are unpaginated; an empty authorized collection returns []. No mutation.

        Rate limits: Application HTTP requests (excluding CORS preflight) share a fixed 60-second window per directly connected client IP (default 60 requests; configurable). HTTP 429 includes Retry-After. Forwarded-IP headers are not trusted; clients behind one proxy share its quota.
      operationId: getAllApplications
      responses:
        "200":
          content:
            application/json:
              examples:
                empty:
                  value: []
                success:
                  value:
                  - appliedAt: 2026-11-25T10:00:00
                    candidateId: 1
                    id: 1
                    jobId: 1
                    status: SUBMITTED
              schema:
                items:
                  $ref: '#/components/schemas/Application'
                type: array
          description: List all applications completed
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "401":
          content:
            application/json:
              examples:
                UNAUTHORIZED:
                  value:
                    code: UNAUTHORIZED
                    details: []
                    error: Unauthorized
                    message: Authentication required
                    path: /api/v1/applications
                    status: 401
                    timestamp: 2026-11-25T10:00:00Z
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Missing, expired, or invalid bearer token."
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "403":
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    details: []
                    error: Forbidden
                    message: You don't have permission to access this resource
                    path: /api/v1/applications
                    status: 403
                    timestamp: 2026-11-25T10:00:00Z
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authenticated caller lacks the required role or ownership.
